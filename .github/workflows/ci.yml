name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint (shellcheck + syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shellcheck all shell scripts
        run: |
          shellcheck stable/*.sh \
                      packaging/build-deb.sh \
                      sync-dictionaries.sh

      - name: Python syntax check
        run: python3 -m py_compile stable/*.py

  test:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest requests

      - name: Run tests
        run: python -m pytest tests -v

  package:
    name: Build .deb
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build Debian package
        run: packaging/build-deb.sh

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: dm-office-tools-deb
          path: dm-office-tools_*_amd64.deb
          if-no-files-found: error

  # NOTE: gh-pages apt रेपो में publish करने के लिए GPG signing
